<style>
  :root {
    --accent: #d1fa94;
    --accent-2: #bff06f;
    --accent-ink: #18280a;
    --text: rgba(255, 255, 255, 0.94);
    --text-dim: rgba(255, 255, 255, 0.5);
    --glass: rgba(255, 255, 255, 0.07);
    --glass-2: rgba(255, 255, 255, 0.1);
    --hair: rgba(255, 255, 255, 0.12);
    --hair-soft: rgba(255, 255, 255, 0.08);
    --radius: 22px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 13px/1.4 system-ui, -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
    letter-spacing: -0.01em;
    color: var(--text);
    background:
      radial-gradient(130% 90% at 50% -10%, rgba(209, 250, 148, 0.10), transparent 55%),
      radial-gradient(120% 100% at 50% 0%, #1a1c20 0%, #0b0b0d 58%);
    user-select: none;
    -webkit-user-select: none;
  }

  #app { position: relative; height: 100%; padding: 16px; display: flex;
    flex-direction: column; gap: 12px; overflow: hidden; }

  /* layout: stacked when compact, two columns (big preview + fixed panel) when expanded.
     Everything is sized to fit the window — the preview flexes, so there is never a scroll. */
  .body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
  .stage { flex: 1 1 auto; min-height: 90px; display: flex; }
  .panel { display: flex; flex-direction: column; gap: 12px; }
  #app.expanded .body { flex-direction: row; align-items: stretch; }
  #app.expanded .stage { flex: 1 1 auto; }
  #app.expanded .panel { flex: 0 0 320px; min-width: 320px; }

  .topbar { display: flex; align-items: center; gap: 10px; padding: 0 2px; }
  .brand { flex: 1; min-width: 0; display: flex; align-items: center; }
  .logo { height: 19px; width: auto; color: var(--text); display: block; }
  .footinfo { padding: 0 4px; }
  .status { font-size: 11px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* glass material helper */
  .card, .icon-btn, .secondary, .preview-wrap {
    background: var(--glass);
    -webkit-backdrop-filter: blur(24px) saturate(165%);
    backdrop-filter: blur(24px) saturate(165%);
    border: 1px solid var(--hair);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 8px 24px rgba(0, 0, 0, 0.28);
  }

  .icon-btn { flex: 0 0 auto; width: 40px; height: 40px; padding: 0; border-radius: 50%;
    cursor: pointer; display: grid; place-items: center;
    transition: transform .14s ease, background .14s ease; }
  .icon-btn:hover { transform: scale(1.06) rotate(-6deg); background: var(--glass-2); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  /* expand button: subtler, no rotate, highlights when active */
  .ghost-icon { color: var(--text-dim); width: 36px; height: 36px; }
  .ghost-icon:hover { transform: scale(1.06); color: var(--text); }
  .ghost-icon svg { filter: none; }
  .ghost-icon.on { color: var(--accent-ink); background: var(--accent); border-color: transparent; }

  .preview-wrap { position: relative; flex: 1 1 auto; min-height: 160px;
    border-radius: var(--radius); padding: 6px; }
  #preview { display: block; width: 100%; height: 100%;
    background: #000; border-radius: 16px; }
  .progress { position: absolute; left: 16px; right: 16px; bottom: 16px; height: 6px;
    background: rgba(255, 255, 255, 0.2); border-radius: 3px; overflow: hidden; }
  #progress-bar { height: 100%; width: 0%; background: var(--accent);
    box-shadow: 0 0 10px rgba(209, 250, 148, 0.6); transition: width .1s linear; }
  .hidden { display: none; }

  /* random style bar */
  .rndbar { display: flex; flex-direction: column; gap: 10px; }
  .rndbar.hidden { display: none; }
  .is-hidden { display: none !important; }
  .segmented { display: flex; gap: 4px; padding: 4px; border-radius: 14px;
    background: var(--glass); border: 1px solid var(--hair);
    -webkit-backdrop-filter: blur(24px) saturate(165%);
    backdrop-filter: blur(24px) saturate(165%); }
  .seg { flex: 1; padding: 8px 4px; border: none; border-radius: 10px; background: transparent;
    color: var(--text-dim); font-size: 12px; font-weight: 600; cursor: pointer;
    transition: background .14s ease, color .14s ease; }
  .seg:hover { color: var(--text); }
  .seg.on { background: var(--accent); color: var(--accent-ink); }

  .card { border-radius: 18px; padding: 14px 16px; display: flex;
    flex-direction: column; gap: 12px; }

  /* sliders (horizontal inset so the knob never touches the card wall) */
  .slider { display: flex; flex-direction: column; gap: 6px; padding: 0 12px; }
  .slabel { display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; color: var(--text-dim); }
  .slabel b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .track { position: relative; height: 24px; display: flex; align-items: center; cursor: pointer; }
  .track::before { content: ""; position: absolute; left: 0; right: 0; height: 5px;
    border-radius: 3px; background: rgba(255, 255, 255, 0.14); }
  .fill { position: absolute; left: 0; height: 5px; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent-2), var(--accent)); width: 0%; }
  .thumb { position: absolute; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; left: 0; transform: translateX(-50%);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45), 0 0 0 0.5px rgba(0, 0, 0, 0.1);
    transition: transform .08s ease; }
  .track.dragging .thumb { transform: translateX(-50%) scale(1.12); }

  /* iOS switch */
  .switch { display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; font-size: 13px; color: var(--text); padding: 2px 12px 0; }
  .sw { position: relative; width: 46px; height: 28px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.16); transition: background .18s ease; }
  .sw .knob { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
    border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
    transition: transform .18s cubic-bezier(.4, 1.2, .5, 1); }
  .switch.on .sw { background: var(--accent); }
  .switch.on .knob { transform: translateX(18px); }

  .estimate { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
  .estimate.warn { color: #f0c24a; }

  .actions { display: flex; gap: 12px; }
  button { font: inherit; font-weight: 600; cursor: pointer; letter-spacing: -0.01em; }
  .primary { flex: 1; padding: 12px; border: none; border-radius: 999px;
    background: linear-gradient(180deg, var(--accent), var(--accent-2)); color: var(--accent-ink);
    box-shadow: 0 6px 18px rgba(209, 250, 148, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    transition: filter .14s ease, transform .06s ease; }
  .primary:hover { filter: brightness(1.05); }
  .primary:active { transform: translateY(1px); }
  .primary:disabled { opacity: .38; cursor: default; filter: none; transform: none;
    box-shadow: none; }
  .secondary { flex: 0 0 92px; padding: 12px; border-radius: 999px; color: var(--text); }
  .secondary:hover { background: var(--glass-2); }

  .resize { position: absolute; right: 5px; bottom: 5px; width: 16px; height: 16px;
    color: var(--text-dim); cursor: nwse-resize; display: grid; place-items: center; opacity: .5; }
  .resize:hover { opacity: 1; }
</style>
